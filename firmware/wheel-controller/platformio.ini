; LOLIN D32 (ESP32-WROOM-32, 4MB flash)
; Build/flash from the CLI — no Arduino IDE needed.
;   .\pio.cmd run              build
;   .\pio.cmd run -t upload    build + flash
;   .\pio.cmd device monitor   serial monitor

[env:lolin_d32]
platform = espressif32
board = lolin_d32
framework = arduino

upload_port = COM10
monitor_port = COM10
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=3
